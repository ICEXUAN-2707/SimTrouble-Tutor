server {
    listen 80;
    server_name tutor.example.com;
    return 301 https://tutor.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name tutor.example.com;
    ssl_certificate /etc/letsencrypt/live/tutor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tutor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/simtrouble/current/apps/training_web/dist;
    access_log off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8001;
        add_header Cache-Control "no-store" always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
